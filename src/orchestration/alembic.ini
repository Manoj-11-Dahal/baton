[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by DATABASE_URL env)
sqlalchemy.url = postgresql+psycopg2://orch_user:orch_pass@localhost:5432/orchestration

[post_write_hooks]
# [post_write_hooks] section
# post_write_hooks defines scripts or Python functions to run on newly generated
# migration scripts. See documentation for further details and examples

# post_write_hooks = blackconsole

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
